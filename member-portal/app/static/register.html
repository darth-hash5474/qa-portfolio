<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="register-page" class="card">
        <h1>Register</h1>
        <form id="register-form" novalidate>
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required autofocus>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" maxlength="256" required>

            <p id="register-error" class="error" role="alert" hidden></p>

            <button id="register" type="submit">Register</button>
        </form>
        <a id="login-link" class="button secondary" href="index.html">Login</a>
    </main>

    <main id="register-success" class="card" role="status" hidden>
        <h1>Registration successful</h1>
        <p>Your account was created as <strong id="member-name"></strong>.</p>
        <a id="login-link-after" class="button" href="index.html">Login</a>
    </main>

    <script src="app.js"></script>
</body>
</html>
