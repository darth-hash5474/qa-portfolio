<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="login-page" class="card">
        <h1>Login</h1>
        <form id="login-form" novalidate>
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required autofocus>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>

            <p id="login-error" class="error" role="alert" hidden></p>

            <button id="login" type="submit">Login</button>
        </form>
    </main>

    <main id="login-success" class="card" role="status" hidden>
        <h1>Login successful</h1>
        <p>You are logged in as <strong id="member-name"></strong>.</p>
    </main>

    <script src="app.js"></script>
</body>
</html>
