name: Game Library tests

on:
  push:
    branches: [main]
    paths:
      - "game-library/**"
      - ".github/workflows/game-library.yml"
  pull_request:
    paths:
      - "game-library/**"
      - ".github/workflows/game-library.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: game-library

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: game-library/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-library/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci
          npx playwright install --with-deps chromium

      - name: Run unit tests
        run: pytest tests/unit -v

      - name: Run API tests
        if: ${{ !cancelled() }}
        run: pytest tests/api -v

      # Playwright starts the app itself, using the Python set up above
      - name: Run UI tests
        if: ${{ !cancelled() }}
        run: npx playwright test

      - name: Upload UI test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: game-library/playwright-report/
